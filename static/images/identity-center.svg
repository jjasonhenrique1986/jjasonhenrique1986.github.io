<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Fluxo de login com o IAM Identity Center</title>
  <desc id="d">O AWS CLI abre o portal de acesso no navegador, o usuário entra com senha e MFA, o Identity Center devolve um token, o CLI troca o token por credenciais temporárias e usa essas credenciais na role do permission set.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="440" rx="16" fill="#ffffff"/>

  <!-- Máquina -->
  <rect x="24" y="24" width="300" height="392" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="44" y="54" font-size="15" font-weight="600" fill="#64748b">Sua máquina</text>

  <rect x="56" y="80" width="236" height="96" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="174" y="118" font-size="18" font-weight="700" fill="#0c4a6e" text-anchor="middle">AWS CLI</text>
  <text x="174" y="146" font-size="14" fill="#0c4a6e" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">aws sso login</text>

  <rect x="56" y="272" width="236" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="174" y="310" font-size="18" font-weight="700" fill="#78350f" text-anchor="middle">Navegador</text>
  <text x="174" y="338" font-size="14" fill="#78350f" text-anchor="middle">senha + MFA</text>

  <!-- AWS -->
  <rect x="388" y="24" width="548" height="392" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="408" y="54" font-size="15" font-weight="600" fill="#64748b">AWS</text>

  <rect x="420" y="272" width="236" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="538" y="304" font-size="18" font-weight="700" fill="#4c1d95" text-anchor="middle">IAM Identity Center</text>
  <text x="538" y="330" font-size="14" fill="#4c1d95" text-anchor="middle">portal de acesso</text>
  <text x="538" y="352" font-size="14" fill="#4c1d95" text-anchor="middle">usuário + permission sets</text>

  <rect x="676" y="80" width="236" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="794" y="112" font-size="18" font-weight="700" fill="#14532d" text-anchor="middle">Conta AWS</text>
  <text x="794" y="138" font-size="13" fill="#14532d" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">AWSReservedSSO_</text>
  <text x="794" y="158" font-size="13" fill="#14532d" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">AdministratorAccess_*</text>

  <!-- 1: CLI abre o navegador -->
  <line x1="174" y1="176" x2="174" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#seta)"/>
  <circle cx="150" cy="222" r="13" fill="#0f172a"/><text x="150" y="227" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="186" y="227" font-size="13" fill="#334155">abre o portal</text>

  <!-- 2: navegador -> Identity Center -->
  <line x1="292" y1="320" x2="416" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#seta)"/>
  <circle cx="354" cy="296" r="13" fill="#0f172a"/><text x="354" y="301" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="354" y="346" font-size="13" fill="#334155" text-anchor="middle">login</text>

  <!-- 3: Identity Center -> CLI (token) -->
  <path d="M480,272 L480,128 L296,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#seta)"/>
  <circle cx="480" cy="210" r="13" fill="#0f172a"/><text x="480" y="215" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="496" y="196" font-size="13" fill="#334155">token SSO, trocado por</text>
  <text x="496" y="214" font-size="13" fill="#334155">credenciais temporárias</text>

  <!-- 4: CLI -> conta (credenciais temporárias) -->
  <line x1="296" y1="100" x2="672" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#seta)"/>
  <circle cx="560" cy="100" r="13" fill="#0f172a"/><text x="560" y="105" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="484" y="82" font-size="13" fill="#334155" text-anchor="middle">chamadas à AWS com as credenciais da role</text>

  <!-- Identity Center provisiona a role -->
  <path d="M656,320 L794,320 L794,180" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <text x="806" y="268" font-size="13" fill="#4c1d95">permission set</text>
  <text x="806" y="286" font-size="13" fill="#4c1d95">vira role na conta</text>

  <text x="480" y="402" font-size="13" fill="#64748b" text-anchor="middle">Nenhuma access key fixa: o token e as credenciais expiram sozinhos.</text>
</svg>
